[package]
name = "uefi-gpu"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "uefi-gpu"
path = "src/main.rs"

[dependencies]
uefi = { version = "0.35", features = ["alloc", "global_allocator", "panic_handler"] }
uefi-raw = "0.11"
libm = "=0.2.16"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
